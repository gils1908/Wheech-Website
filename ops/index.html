<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wheech ops">
  <title>Wheech ops</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/wheech-lz.css">
  <link rel="stylesheet" href="../css/ops.css">
</head>
<body class="ops-page">
  <div class="ops-shell">
    <header class="ops-top">
      <div>
        <p class="ops-kicker">Wheech</p>
        <h1 class="ops-title" id="ops-heading">Ops snapshot</h1>
        <p class="ops-heading-meta ops-hidden" id="ops-heading-meta" hidden></p>
      </div>
      <div class="ops-top-actions">
        <button type="button" class="ops-ghost ops-refresh ops-hidden" id="ops-refresh" hidden aria-label="Refresh">
          <svg class="ops-refresh__wheel" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 16"/>
          </svg>
          Refresh
        </button>
        <button type="button" class="ops-ghost ops-hidden" id="ops-signout" hidden>Sign out</button>
      </div>
    </header>

    <p class="ops-error" id="ops-error" hidden></p>

    <section class="ops-card" id="ops-login">
      <form class="ops-form" id="ops-magic">
        <input id="ops-email" type="email" autocomplete="email" placeholder="you@email.com" required>
        <button class="ops-primary" type="submit">Email magic link</button>
      </form>
      <button class="ops-google" type="button" id="ops-google">Continue with Google</button>
    </section>

    <section id="ops-board" class="ops-hidden" hidden>
      <div class="ops-grid">
        <article class="ops-tile">
          <p class="ops-tile__label">Users</p>
          <p class="ops-tile__value" id="ops-users">—</p>
        </article>
        <article class="ops-tile">
          <p class="ops-tile__label">Matchups</p>
          <p class="ops-tile__row">
            <span class="ops-tile__value ops-tile__value--sm" id="ops-matchups-user">—</span>
            <span class="ops-tile__unit">user</span>
          </p>
          <p class="ops-tile__row">
            <span class="ops-tile__value ops-tile__value--sm" id="ops-matchups-generated">—</span>
            <span class="ops-tile__unit">generated</span>
          </p>
        </article>
        <article class="ops-tile">
          <p class="ops-tile__label">Votes</p>
          <p class="ops-tile__value" id="ops-votes">—</p>
        </article>
        <article class="ops-tile">
          <p class="ops-tile__label">Early voting</p>
          <p class="ops-tile__value" id="ops-early">—</p>
          <p class="ops-tile__hint" id="ops-early-hint"></p>
        </article>
      </div>
      <div class="ops-card" style="margin-top:12px">
        <p class="ops-kicker">Red flags</p>
        <ul class="ops-flags" id="ops-flags"></ul>
      </div>
      <div class="ops-card ops-sync" style="margin-top:12px">
        <div class="ops-sync__head">
          <p class="ops-kicker">NFL sync</p>
          <span class="ops-badge" id="ops-sync-badge">—</span>
        </div>
        <p class="ops-sync__when" id="ops-sync-when">—</p>
        <p class="ops-tile__hint" id="ops-sync-hint"></p>
        <button type="button" class="ops-ghost ops-sync__run" id="ops-sync-run">Run sync</button>
      </div>
      <div class="ops-card" style="margin-top:12px">
        <p class="ops-kicker">Crons</p>
        <ul class="ops-crons" id="ops-crons"></ul>
      </div>
    </section>

    <p class="ops-status" id="ops-status"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="../js/ops.js?v=hourly" defer></script>
</body>
</html>
